<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Vie & Objectifs</title>
<style>
:root{
  --bg:#000000;
  --bg-2:#0D0D10;
  --glass:#131316;
  --glass-hi:#1C1C21;
  --border:rgba(255,255,255,0.10);
  --blue:#6699FF;
  --blue-glow:rgba(102,153,255,0.35);
  --amber:#FF9966;
  --amber-glow:rgba(255,153,102,0.4);
  --turq:#CC99FF;
  --off:#F5F0E6;
  --dim:#9D9DB8;
  --dim-2:#5C5C74;
  --orange:#FFCC66;
  --red:#FF6666;
  --green:#66FFCC;
  --radius:26px;
  --radius-sm:20px;
  --shadow:0 2px 10px rgba(0,0,0,0.5);
  --mono:'Consolas','SF Mono','JetBrains Mono',ui-monospace,Menlo,monospace;
  --display:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  background:
    radial-gradient(1100px 600px at 12% -8%, rgba(255,167,38,0.08), transparent 60%),
    radial-gradient(900px 550px at 105% 5%, rgba(45,212,191,0.06), transparent 55%),
    var(--bg);
  color:var(--off);
  font-family:var(--sans);
  min-height:100vh;
  overflow-x:hidden;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--amber-glow);}
button{font-family:inherit;}
.app{max-width:560px;margin:0 auto;padding:22px 16px 100px;min-height:100vh;position:relative;}

.header{position:relative;display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:26px;padding:10px 14px 20px;}
.header::after{content:'';position:absolute;left:14px;right:14px;bottom:0;height:8px;background:linear-gradient(90deg,var(--amber),var(--turq) 60%,transparent);border-radius:0 0 0 999px;}
.hello{font-family:var(--display);font-size:24px;font-weight:700;letter-spacing:-0.01em;}
.hello span{color:var(--dim);font-weight:500;}
.date{font-family:var(--mono);font-size:11px;color:var(--dim-2);text-transform:uppercase;letter-spacing:0.08em;margin-top:5px;}
.brand{font-family:var(--mono);font-size:10px;letter-spacing:0.18em;color:var(--dim-2);text-transform:uppercase;border:1px solid var(--border);border-radius:20px;padding:6px 10px;white-space:nowrap;}
.brand b{color:var(--amber);}

.view{display:none;animation:fadein .35s ease;}
.view.active{display:block;}
@keyframes fadein{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

.section-title{font-family:var(--display);font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:0.08em;margin:18px 0 10px;font-weight:700;}
.section-title:first-child{margin-top:0;}

.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px;}
.stat-card{background:var(--glass);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 6px;text-align:center;box-shadow:var(--shadow);}
.stat-num{font-family:var(--mono);font-size:17px;font-weight:700;}
.stat-label{font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:0.03em;margin-top:3px;}

.toolbar-inline{display:flex;gap:8px;margin-bottom:10px;}
.inline-input{flex:1;background:var(--glass);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--off);padding:11px 14px;font-size:13.5px;font-family:inherit;}
.inline-input::placeholder{color:var(--dim-2);}
.inline-add{background:linear-gradient(135deg,var(--amber),var(--turq));border:none;color:#0A0D12;font-weight:700;font-size:18px;width:44px;border-radius:var(--radius-sm);cursor:pointer;flex-shrink:0;}

.filter-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
.filter-chip{background:var(--glass);border:1px solid var(--border);border-radius:999px;padding:8px 14px;font-size:12px;color:var(--dim);cursor:pointer;white-space:nowrap;}
.filter-chip.active{border-color:var(--amber);background:rgba(255,153,102,0.14);color:var(--amber);}

.dossier-list{display:flex;flex-direction:column;gap:9px;}
.dossier-card{background:var(--glass);border:1px solid var(--border);border-left:3px solid var(--dim-2);border-radius:var(--radius-sm);padding:13px 15px;cursor:pointer;box-shadow:var(--shadow);}
.dossier-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:5px;}
.dossier-client{font-family:var(--display);font-size:14px;font-weight:700;}
.dossier-badge{font-family:var(--mono);font-size:9.5px;text-transform:uppercase;padding:3px 9px;border-radius:10px;background:var(--bg-2);color:var(--dim);white-space:nowrap;}
.dossier-meta{display:flex;gap:10px;flex-wrap:wrap;font-size:11.5px;color:var(--dim);align-items:center;}
.dossier-days{font-family:var(--mono);}
.dossier-days.danger{color:var(--red);font-weight:700;}
.dossier-days.warn{color:var(--orange);font-weight:700;}
.dossier-days.good{color:var(--green);font-weight:700;}

.empty-state{text-align:center;color:var(--dim-2);font-size:13px;padding:30px 10px;font-style:italic;}

.field-label{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:0.08em;margin:14px 0 6px;}
input[type=text], input[type=number], input[type=date], textarea, select.select-native{
  width:100%;background:var(--glass);border:1px solid var(--border);border-radius:var(--radius-sm);
  color:var(--off);padding:11px 14px;font-size:14px;font-family:inherit;
}
textarea{resize:vertical;}
.status-grid{display:grid;gap:8px;}
.status-opt{background:var(--glass);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 8px;text-align:center;font-size:11.5px;font-weight:600;cursor:pointer;color:var(--dim);}
.status-opt.active{color:#0A0D12;font-weight:700;background:var(--amber);border-color:var(--amber);}

.btn{width:100%;background:linear-gradient(135deg,var(--amber),var(--turq));border:none;color:#0A0D12;font-weight:700;font-size:14px;padding:13px;border-radius:var(--radius-sm);cursor:pointer;margin-top:16px;letter-spacing:0.01em;}
.btn:active{transform:scale(0.98);}
.btn.ghost{background:var(--glass);border:1px solid var(--border);color:var(--off);}
.btn.danger{background:none;border:1px solid var(--red);color:var(--red);}
.btn.small{padding:9px;font-size:12.5px;margin-top:0;}

.note-item{background:var(--glass);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;margin-top:8px;box-shadow:var(--shadow);}
.note-date{font-family:var(--mono);font-size:10px;color:var(--dim-2);text-transform:uppercase;margin-bottom:4px;}
.note-text{font-size:13.5px;line-height:1.4;}
.note-empty{font-size:12.5px;color:var(--dim-2);font-style:italic;padding:6px 0;}

.panel-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:90;align-items:flex-end;}
.panel-overlay.active{display:flex;}
.panel{background:var(--bg-2);border-top-left-radius:24px;border-top-right-radius:24px;width:100%;max-height:88vh;overflow-y:auto;padding:14px 20px 34px;box-shadow:0 -8px 30px rgba(0,0,0,0.5);}
.panel-handle{width:40px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 14px;}
.panel-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.panel-title{font-family:var(--display);font-size:17px;font-weight:700;}
.panel-close{background:var(--glass);border:1px solid var(--border);border-radius:50%;width:32px;height:32px;color:var(--dim);cursor:pointer;font-size:14px;}

.nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;padding:14px 16px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(to top, var(--bg) 55%, transparent);pointer-events:none;}
.nav-inner{pointer-events:auto;display:flex;gap:5px;background:var(--bg-2);border:1px solid var(--border);border-radius:999px;padding:6px;max-width:460px;width:100%;box-shadow:var(--shadow);}
.nav-btn{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 4px;background:var(--glass);border:none;border-radius:999px;color:var(--dim);cursor:pointer;transition:all .2s;}
.nav-btn.active{color:#000;font-weight:800;}
.nav-btn:nth-child(1).active{background:var(--amber);}
.nav-btn:nth-child(2).active{background:var(--turq);}
.nav-btn:nth-child(3).active{background:var(--blue);}
.nav-btn:nth-child(4).active{background:var(--orange);}
.nav-icon{font-size:17px;}
.nav-txt{font-size:9.5px;text-transform:uppercase;letter-spacing:0.04em;}

/* BUDGET */
.cat-card{background:var(--glass);border:1px solid var(--border);border-radius:var(--radius-sm);padding:13px 15px;box-shadow:var(--shadow);margin-bottom:9px;}
.cat-top{display:flex;justify-content:space-between;font-size:13.5px;font-weight:700;margin-bottom:6px;}
.cat-sub{font-family:var(--mono);font-size:11px;color:var(--dim);}
.cat-bar-track{background:var(--bg-2);border-radius:999px;height:8px;overflow:hidden;margin-top:8px;}
.cat-bar-fill{height:100%;border-radius:999px;transition:width .3s;}
.cat-edit-row{display:flex;gap:8px;align-items:center;background:var(--glass);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:8px;}
.cat-edit-row input{padding:8px 10px;font-size:13px;}
.cat-edit-row .cat-del{background:none;border:1px solid var(--red);color:var(--red);border-radius:10px;width:32px;height:32px;flex-shrink:0;cursor:pointer;}

/* SPORT */
.obj-progress-track{background:var(--bg-2);border-radius:999px;height:8px;overflow:hidden;margin-top:8px;}
.obj-progress-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--amber),var(--turq));}
.obj-quick-btn{font-family:var(--mono);font-size:10.5px;background:rgba(255,153,102,0.14);color:var(--amber);border:1px solid var(--amber);border-radius:10px;padding:5px 10px;cursor:pointer;white-space:nowrap;}

/* SANTE */
.quick-add-row{display:flex;gap:8px;margin-bottom:12px;}
.quick-add-row input{flex:1;padding:10px 12px;font-size:13px;}
.quick-add-row button{background:var(--glass);border:1px solid var(--amber);color:var(--amber);border-radius:var(--radius-sm);padding:0 14px;font-weight:700;cursor:pointer;flex-shrink:0;}
.mini-list-item{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:8px 2px;border-bottom:1px solid var(--border);}
.mini-list-item:last-child{border-bottom:none;}
.mini-del{background:none;border:none;color:var(--dim-2);font-size:15px;cursor:pointer;padding:0 4px;}
.satisfaction-row{display:flex;gap:8px;}
.satisfaction-row button{flex:1;background:var(--glass);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px;font-size:20px;cursor:pointer;}
.satisfaction-row button.active{border-color:var(--amber);background:rgba(255,153,102,0.1);}

/* DEV PERSO */
.habit-card{background:var(--glass);border:1px solid var(--border);border-radius:var(--radius-sm);padding:13px 15px;box-shadow:var(--shadow);margin-bottom:9px;}
.habit-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;}
.habit-name{font-family:var(--display);font-size:14px;font-weight:700;}
.habit-streak{font-family:var(--mono);font-size:11px;color:var(--amber);}
.habit-days{display:flex;gap:6px;justify-content:space-between;}
.habit-day{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;}
.habit-day-lbl{font-size:9px;color:var(--dim-2);text-transform:uppercase;}
.habit-day-btn{width:30px;height:30px;border-radius:50%;background:var(--bg-2);border:1px solid var(--border);color:var(--dim-2);cursor:pointer;font-size:13px;}
.habit-day-btn.done{background:var(--green);border-color:var(--green);color:#0A0D12;font-weight:700;}
.etape-row{display:flex;align-items:center;gap:9px;background:var(--glass);border:1px solid var(--border);border-radius:14px;padding:9px 11px;margin-top:6px;}
.etape-check{width:22px;height:22px;border-radius:50%;border:1px solid var(--border);background:var(--bg-2);cursor:pointer;flex-shrink:0;color:var(--green);font-size:12px;display:flex;align-items:center;justify-content:center;}
.etape-check.done{background:var(--green);border-color:var(--green);color:#0A0D12;}
.etape-text{flex:1;font-size:13px;}
.etape-text.done{text-decoration:line-through;color:var(--dim-2);}
.etape-del{background:none;border:none;color:var(--dim-2);cursor:pointer;font-size:14px;}
.journal-card{background:var(--glass);border:1px solid var(--border);border-radius:var(--radius-sm);padding:13px 15px;box-shadow:var(--shadow);margin-bottom:9px;}
.journal-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.journal-date{font-family:var(--mono);font-size:10.5px;color:var(--dim-2);text-transform:uppercase;}
.journal-mood{font-size:17px;}
.journal-text{font-size:13.5px;line-height:1.45;}
</style>
</head>
<body>

<div class="app">

  <div class="header">
    <div>
      <div class="hello">Vie <span>&amp; Objectifs</span></div>
      <div class="date" id="today-date">—</div>
    </div>
    <div class="brand">FRANCK <b>VIE</b></div>
  </div>

  <!-- ============ VUE BUDGET ============ -->
  <div class="view active" id="view-budget">
    <div class="section-title">Ce mois-ci</div>
    <div class="stats-row" id="budget-stats"></div>
    <button class="btn ghost" id="btn-cat-manage" style="margin-top:0;">⚙️ Gérer les catégories</button>

    <div class="section-title">Catégories</div>
    <div id="cat-list"></div>

    <div class="section-title">Transactions</div>
    <div class="toolbar-inline">
      <button class="inline-add" id="btn-tx-add" style="width:auto;flex:1;font-size:14px;">+ Ajouter une transaction</button>
    </div>
    <div class="filter-row" id="tx-filter-row"></div>
    <div class="dossier-list" id="tx-list"></div>
  </div>

  <!-- ============ VUE SPORT ============ -->
  <div class="view" id="view-sport">
    <div class="section-title">Objectifs & programme</div>
    <div class="stats-row" id="sport-stats"></div>
    <button class="btn" id="btn-obj-add" style="margin-top:0;">＋ Nouvel objectif</button>
    <div class="dossier-list" id="obj-list" style="margin-top:14px;"></div>
  </div>

  <!-- ============ VUE SANTE ============ -->
  <div class="view" id="view-sante">
    <div class="section-title">Suivi de santé</div>
    <div class="stats-row" id="sante-stats"></div>

    <div class="section-title">Rendez-vous & examens</div>
    <button class="btn" id="btn-rdv-add" style="margin-top:0;">＋ Nouveau RDV / examen</button>
    <div class="filter-row" id="rdv-filter-row" style="margin-top:14px;"></div>
    <div class="dossier-list" id="rdv-list"></div>

    <div class="section-title">Poids</div>
    <div class="quick-add-row">
      <input type="date" id="poids-date">
      <input type="number" step="0.1" id="poids-valeur" placeholder="Poids (kg)">
      <button id="btn-poids-add">Ajouter</button>
    </div>
    <div id="poids-chart"></div>
    <div id="poids-list"></div>

    <div class="section-title">Sommeil</div>
    <div class="quick-add-row">
      <input type="date" id="sommeil-date">
      <input type="number" step="0.5" id="sommeil-heures" placeholder="Heures">
      <button id="btn-sommeil-add">Ajouter</button>
    </div>
    <div id="sommeil-chart"></div>
    <div id="sommeil-list"></div>
  </div>

  <!-- ============ VUE DEV PERSO ============ -->
  <div class="view" id="view-devperso">
    <div class="section-title">Développement personnel</div>
    <div class="stats-row" id="devperso-stats"></div>

    <div class="section-title">Habitudes quotidiennes</div>
    <div class="toolbar-inline">
      <input type="text" class="inline-input" id="habit-input" placeholder="Nouvelle habitude...">
      <button class="inline-add" id="btn-habit-add">+</button>
    </div>
    <div id="habit-list"></div>

    <div class="section-title">Objectifs à moyen/long terme</div>
    <button class="btn" id="btn-objperso-add" style="margin-top:0;">＋ Nouvel objectif</button>
    <div class="dossier-list" id="objperso-list" style="margin-top:14px;"></div>

    <div class="section-title">Journal / réflexion</div>
    <button class="btn ghost" id="btn-journal-add" style="margin-top:0;">✍️ Nouvelle entrée</button>
    <div id="journal-list" style="margin-top:14px;"></div>
  </div>

</div>

<div class="panel-overlay" id="panel-overlay">
  <div class="panel" id="panel-content"></div>
</div>

<div class="nav">
  <div class="nav-inner">
    <button class="nav-btn active" data-view="budget"><span class="nav-icon">💶</span><span class="nav-txt">Budget</span></button>
    <button class="nav-btn" data-view="sport"><span class="nav-icon">🏋️</span><span class="nav-txt">Sport</span></button>
    <button class="nav-btn" data-view="sante"><span class="nav-icon">🩺</span><span class="nav-txt">Santé</span></button>
    <button class="nav-btn" data-view="devperso"><span class="nav-icon">🌱</span><span class="nav-txt">Dev Perso</span></button>
  </div>
</div>

<script>
(function(){

const STORAGE_KEY = 'devperso_v1';
const DEFAULT_STATE = {
  categories: [],
  transactions: [],
  objectifsSport: [],
  rdvSante: [],
  poids: [],
  sommeil: [],
  habitudes: [],
  objectifsPerso: [],
  journal: []
};

function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return structuredClone(DEFAULT_STATE);
    const parsed = JSON.parse(raw);
    Object.keys(DEFAULT_STATE).forEach(k=>{ if(!parsed[k]) parsed[k] = structuredClone(DEFAULT_STATE[k]); });
    return parsed;
  }catch(e){ return structuredClone(DEFAULT_STATE); }
}
let state = load();
function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

function escapeHtml(s){ const d=document.createElement('div'); d.textContent = s||''; return d.innerHTML; }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function closePanel(){ document.getElementById('panel-overlay').classList.remove('active'); }
function openPanel(){ document.getElementById('panel-overlay').classList.add('active'); }

function dateKeyFromDate(d){ const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${day}`; }
function todayKey(){ return dateKeyFromDate(new Date()); }
function todayInputVal(){ return todayKey(); }
function tsFromDateInput(val){ return val ? new Date(val+'T12:00:00').getTime() : Date.now(); }
function fmtDate(ts){ return new Date(ts).toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'}); }
function fmtDateShort(ts){ return new Date(ts).toLocaleDateString('fr-FR',{day:'numeric',month:'short'}); }
function nowNoteDate(){ return new Date().toLocaleDateString('fr-FR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}); }

document.getElementById('today-date').textContent = new Date().toLocaleDateString('fr-FR', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
document.getElementById('poids-date').value = todayInputVal();
document.getElementById('sommeil-date').value = todayInputVal();

/* ---------- NAV ---------- */
document.querySelectorAll('.nav-btn').forEach(btn=>{
  btn.onclick = ()=>{
    document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('view-'+btn.dataset.view).classList.add('active');
  };
});

function sparklineSvg(values, color){
  if(values.length<2) return '<div class="empty-state" style="padding:14px 0;">Pas assez de données pour un graphique.</div>';
  const w=300,h=60,pad=6;
  const min=Math.min(...values), max=Math.max(...values);
  const range=(max-min)||1;
  const stepX=(w-2*pad)/(values.length-1);
  const points=values.map((v,i)=>{
    const x=pad+i*stepX;
    const y=h-pad-((v-min)/range)*(h-2*pad);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="width:100%;height:60px;display:block;margin-bottom:8px;"><polyline points="${points}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

/* =====================================================================
   BUDGET
   ===================================================================== */
function currentMonthKey(){ return todayKey().slice(0,7); }
function monthKeyFromTs(ts){ return dateKeyFromDate(new Date(ts)).slice(0,7); }

function depensesCatMoisCourant(catId){
  return state.transactions
    .filter(t=>t.type==='depense' && t.categorieId===catId && monthKeyFromTs(t.date)===currentMonthKey())
    .reduce((s,t)=>s+t.montant,0);
}
function catColor(pct){ return pct>=100 ? 'var(--red)' : pct>=80 ? 'var(--orange)' : 'var(--green)'; }

function renderBudgetStats(){
  const wrap = document.getElementById('budget-stats');
  const mk = currentMonthKey();
  const txMois = state.transactions.filter(t=>monthKeyFromTs(t.date)===mk);
  const depenses = txMois.filter(t=>t.type==='depense').reduce((s,t)=>s+t.montant,0);
  const revenus = txMois.filter(t=>t.type==='revenu').reduce((s,t)=>s+t.montant,0);
  const solde = revenus-depenses;
  const limiteTotale = state.categories.reduce((s,c)=>s+c.limite,0);
  const restant = Math.max(0, limiteTotale-depenses);
  const items = [
    { n: (solde>=0?'+':'')+solde.toLocaleString('fr-FR')+' €', l:'Solde du mois' },
    { n: depenses.toLocaleString('fr-FR')+' €', l:'Dépenses' },
    { n: revenus.toLocaleString('fr-FR')+' €', l:'Revenus' },
    { n: restant.toLocaleString('fr-FR')+' €', l:'Budget restant' }
  ];
  wrap.innerHTML = items.map(i=>`<div class="stat-card"><div class="stat-num" style="font-size:14px;">${i.n}</div><div class="stat-label">${i.l}</div></div>`).join('');
}

function startOfWeekMonday(d){
  const day = d.getDay();
  const diff = (day===0?-6:1-day);
  const monday = new Date(d);
  monday.setDate(d.getDate()+diff);
  monday.setHours(0,0,0,0);
  return monday;
}
function seancesCetteSemaine(o){
  const monday = startOfWeekMonday(new Date());
  return o.seances.filter(k=> new Date(k+'T12:00:00') >= monday).length;
}
function progValeurActuelle(o){
  if(o.historique.length===0) return o.valeurDepart||0;
  return o.historique[o.historique.length-1].valeur;
}

  const seancesSemaine = state.objectifsSport.filter(o=>o.type==='frequence').reduce((s,o)=>s+seancesCetteSemaine(o),0);
  const items = [
    { n: actifs.length, l:'Objectifs actifs' },

  wrap.innerHTML = items.map(i=>`<div class="stat-card"><div class="stat-num">${i.n}</div><div class="stat-label">${i.l}</div></div>`).join('');
}

/* =====================================================================
   SANTE
   ===================================================================== */
function rdvStatut(r){
  if(r.annule) return 'annule';
  const today = new Date(); today.setHours(0,0,0,0);
  const d = new Date(r.date); d.setHours(0,0,0,0);
  return d < today ? 'passe' : 'avenir';
}
function renderSanteStats(){
  const wrap = document.getElementById('sante-stats');
  const avenir = state.rdvSante.filter(r=>rdvStatut(r)==='avenir').sort((a,b)=>a.date-b.date);
  const prochain = avenir.length ? Math.ceil((avenir[0].date-Date.now())/(24*3600*1000)) : null;
  const poidsOrdonne = state.poids.slice().sort((a,b)=>a.date-b.date);
  const dernierPoids = poidsOrdonne.length ? poidsOrdonne[poidsOrdonne.length-1].valeur : null;
  const avantDernierPoids = poidsOrdonne.length>1 ? poidsOrdonne[poidsOrdonne.length-2].valeur : null;
  const deltaPoids = (dernierPoids!==null && avantDernierPoids!==null) ? (dernierPoids-avantDernierPoids) : null;
  const sommeilRecent = state.sommeil.filter(s=> (Date.now()-s.date) < 7*24*3600*1000);
  const moyenneSommeil = sommeilRecent.length ? (sommeilRecent.reduce((s,x)=>s+x.heures,0)/sommeilRecent.length).toFixed(1) : '—';
  const rdv30j = state.rdvSante.filter(r=>rdvStatut(r)==='avenir' && (r.date-Date.now())<30*24*3600*1000).length;
  const items = [
    { n: prochain!==null ? prochain+'j' : '—', l:'Prochain RDV' },
    { n: dernierPoids!==null ? dernierPoids+' kg'+(deltaPoids!==null?` (${deltaPoids>=0?'+':''}${deltaPoids.toFixed(1)})`:'') : '—', l:'Poids actuel' },
    { n: moyenneSommeil!=='—' ? moyenneSommeil+'h' : '—', l:'Sommeil moy. 7j' },
    { n: rdv30j, l:'RDV sous 30j' }
  ];
  wrap.innerHTML = items.map(i=>`<div class="stat-card"><div class="stat-num" style="font-size:13px;">${i.n}</div><div class="stat-label">${i.l}</div></div>`).join('');
}

      <div class="panel-title">${isNew?'Nouveau RDV / examen':'RDV / examen'}</div>
      <button class="panel-close" id="panel-close">✕</button>
    </div>
    <div class="field-label" style="margin-top:0;">Type</div>
    <div class="status-grid" id="rdv-type-grid" style="grid-template-columns:1fr 1fr;"></div>
    <div class="field-label">Spécialiste / laboratoire</div>
    <input type="text" id="rdv-specialiste" value="${escapeHtml(r.specialiste)}" placeholder="Ex : Dr Martin, cardiologue">
    <div class="field-label">Motif</div>
    <input type="text" id="rdv-motif" value="${escapeHtml(r.motif)}" placeholder="Ex : bilan annuel, prise de sang">
    <div class="field-label">Date</div>
    <input type="date" id="rdv-date" value="${dateKeyFromDate(new Date(r.date))}">
    <div class="field-label">Notes / résultat</div>
    <textarea id="rdv-notes" rows="3" placeholder="Compte-rendu, résultat, à retenir...">${escapeHtml(r.notes)}</textarea>
    <div class="field-label">Annulé ?</div>
    <div class="status-grid" id="rdv-annule-grid" style="grid-template-columns:1fr 1fr;"></div>
    <button class="btn" id="btn-rdv-save">${isNew?'Créer':'Enregistrer'}</button>
    ${!isNew ? `<button class="btn danger" id="btn-rdv-delete">Supprimer</button>` : ''}
  `;
  let typeChoisi = r.type;
  const typeGrid = panel.querySelector('#rdv-type-grid');
  [['rdv','RDV'],['examen','Examen']].forEach(([v,label])=>{
    const b = document.createElement('button');
    b.className = 'status-opt'+(typeChoisi===v?' active':'');
    b.textContent = label;
    b.onclick = ()=>{ typeChoisi=v; typeGrid.querySelectorAll('.status-opt').forEach(x=>x.classList.remove('active')); b.classList.add('active'); };
    typeGrid.appendChild(b);
  });
  let annuleChoisi = r.annule;
  const annuleGrid = panel.querySelector('#rdv-annule-grid');
  [[true,'Oui'],[false,'Non']].forEach(([v,label])=>{
    const b = document.createElement('button');
    b.className = 'status-opt'+(annuleChoisi===v?' active':'');
    b.textContent = label;
    b.onclick = ()=>{ annuleChoisi=v; annuleGrid.querySelectorAll('.status-opt').forEach(x=>x.classList.remove('active')); b.classList.add('active'); };
    annuleGrid.appendChild(b);
  });

  panel.querySelector('#btn-rdv-save').onclick = ()=>{
    const specialiste = panel.querySelector('#rdv-specialiste').value.trim();
    if(!specialiste){ alert('Le spécialiste / laboratoire est requis.'); return; }
    r.type = typeChoisi;
    r.specialiste = specialiste;
    r.motif = panel.querySelector('#rdv-motif').value.trim();
    r.date = tsFromDateInput(panel.querySelector('#rdv-date').value);
    r.notes = panel.querySelector('#rdv-notes').value.trim();
    r.annule = annuleChoisi;
    if(isNew) state.rdvSante.push(r);
    save(); closePanel();
    renderSanteStats(); renderRdvList();
  };
  if(!isNew){
    panel.querySelector('#btn-rdv-delete').onclick = ()=>{
      if(!confirm(`Supprimer ce RDV avec ${r.specialiste} ?`)) return;
      state.rdvSante = state.rdvSante.filter(x=>x.id!==id);
      save(); closePanel();
      renderSanteStats(); renderRdvList();
    };
  }
  panel.querySelector('#panel-close').onclick = closePanel;
  openPanel();
}
document.getElementById('btn-rdv-add').onclick = ()=> openRdvPanel(null);

function renderPoids(){
  const ordonne = state.poids.slice().sort((a,b)=>a.date-b.date);
  document.getElementById('poids-chart').innerHTML = sparklineSvg(ordonne.slice(-15).map(p=>p.valeur), 'var(--turq)');
  const listWrap = document.getElementById('poids-list');
  const recents = ordonne.slice().reverse().slice(0,8);
  if(recents.length===0){
    listWrap.innerHTML = `<div class="empty-state">Aucun relevé de poids.</div>`;
    return;
  }
  listWrap.innerHTML = recents.map((p,i)=>{
    const prev = ordonne[ordonne.length-2-i];
    const delta = prev ? (p.valeur-prev.valeur) : null;
    return `<div class="mini-list-item"><span>${fmtDateShort(p.date)}</span><span>${p.valeur} kg ${delta!==null?`<span style="color:${delta<=0?'var(--green)':'var(--orange)'};font-family:var(--mono);font-size:11px;">(${delta>=0?'+':''}${delta.toFixed(1)})</span>`:''}</span><button class="mini-del" data-id="${p.id}">✕</button></div>`;
  }).join('');
  listWrap.querySelectorAll('.mini-del').forEach(btn=>{
    btn.onclick = ()=>{ state.poids = state.poids.filter(x=>x.id!==btn.dataset.id); save(); renderPoids(); renderSanteStats(); };
  });
}
document.getElementById('btn-poids-add').onclick = ()=>{
  const dateVal = document.getElementById('poids-date').value;
  const valeur = Number(document.getElementById('poids-valeur').value);
  if(!valeur){ alert('Indique un poids.'); return; }
  state.poids.push({ id: uid(), date: tsFromDateInput(dateVal), valeur });
  document.getElementById('poids-valeur').value = '';
  save(); renderPoids(); renderSanteStats();
};

function renderSommeil(){
  const ordonne = state.sommeil.slice().sort((a,b)=>a.date-b.date);
  document.getElementById('sommeil-chart').innerHTML = sparklineSvg(ordonne.slice(-15).map(s=>s.heures), 'var(--blue)');
  const listWrap = document.getElementById('sommeil-list');
  const recents = ordonne.slice().reverse().slice(0,8);
  if(recents.length===0){
    listWrap.innerHTML = `<div class="empty-state">Aucun relevé de sommeil.</div>`;
    return;
  }
  listWrap.innerHTML = recents.map(s=>`<div class="mini-list-item"><span>${fmtDateShort(s.date)}</span><span>${s.heures} h</span><button class="mini-del" data-id="${s.id}">✕</button></div>`).join('');
  listWrap.querySelectorAll('.mini-del').forEach(btn=>{
    btn.onclick = ()=>{ state.sommeil = state.sommeil.filter(x=>x.id!==btn.dataset.id); save(); renderSommeil(); renderSanteStats(); };
  });
}
document.getElementById('btn-sommeil-add').onclick = ()=>{
  const dateVal = document.getElementById('sommeil-date').value;
  const heures = Number(document.getElementById('sommeil-heures').value);
  if(!heures){ alert('Indique un nombre d’heures.'); return; }
  state.sommeil.push({ id: uid(), date: tsFromDateInput(dateVal), heures });
  document.getElementById('sommeil-heures').value = '';
  save(); renderSommeil(); renderSanteStats();
};

/* =====================================================================
   DEV PERSO
   ===================================================================== */
function habitStreak(h){
  const set = new Set(h.historique);
  let streak = 0;
  let d = new Date();
  if(!set.has(dateKeyFromDate(d))) d.setDate(d.getDate()-1);
  while(set.has(dateKeyFromDate(d))){ streak++; d.setDate(d.getDate()-1); }
  return streak;
}
function last7Days(){
  const arr = [];
  for(let i=6;i>=0;i--){
    const d = new Date();
    d.setDate(d.getDate()-i);
    arr.push(d);
  }
  return arr;
}
function renderHabitList(){
  const wrap = document.getElementById('habit-list');
  if(state.habitudes.length===0){
    wrap.innerHTML = `<div class="empty-state">Aucune habitude. Ajoute-en une ci-dessus.</div>`;
    return;
  }
  const days = last7Days();
  wrap.innerHTML = state.habitudes.map(h=>{
    const streak = habitStreak(h);
    const dayBtns = days.map(d=>{
      const key = dateKeyFromDate(d);
      const done = h.historique.includes(key);
      const lbl = d.toLocaleDateString('fr-FR',{weekday:'narrow'});
      return `<div class="habit-day"><span class="habit-day-lbl">${lbl}</span><button class="habit-day-btn ${done?'done':''}" data-habit="${h.id}" data-key="${key}">${done?'✓':''}</button></div>`;
    }).join('');
    return `
      <div class="habit-card">
        <div class="habit-top">
          <span class="habit-name">${escapeHtml(h.nom)}</span>
          <span class="habit-streak">${streak>0?'🔥 '+streak+'j':''}</span>
          <button class="mini-del" data-del-habit="${h.id}">✕</button>
        </div>
        <div class="habit-days">${dayBtns}</div>
      </div>
    `;
  }).join('');
  wrap.querySelectorAll('.habit-day-btn').forEach(btn=>{
    btn.onclick = ()=>{
      const h = state.habitudes.find(x=>x.id===btn.dataset.habit);
      const key = btn.dataset.key;
      const idx = h.historique.indexOf(key);
      if(idx>=0) h.historique.splice(idx,1); else h.historique.push(key);
      save(); renderHabitList(); renderDevPersoStats();
    };
  });
  wrap.querySelectorAll('[data-del-habit]').forEach(btn=>{
    btn.onclick = ()=>{
      if(!confirm('Supprimer cette habitude ?')) return;
      state.habitudes = state.habitudes.filter(x=>x.id!==btn.dataset.delHabit);
      save(); renderHabitList(); renderDevPersoStats();
    };
  });
}
document.getElementById('btn-habit-add').onclick = ()=>{
  const inp = document.getElementById('habit-input');
  const nom = inp.value.trim();
  if(!nom) return;
  state.habitudes.push({ id: uid(), nom, historique: [], dateCreation: Date.now() });
  inp.value='';
  save(); renderHabitList(); renderDevPersoStats();
};

function renderObjPersoList(){
  const wrap = document.getElementById('objperso-list');
  const list = state.objectifsPerso.slice().sort((a,b)=>b.dateCreation-a.dateCreation);
  if(list.length===0){
    wrap.innerHTML = `<div class="empty-state">Aucun objectif. Touche "Nouvel objectif" pour en créer un.</div>`;
    return;
  }
  wrap.innerHTML = '';
  list.forEach(o=>{
    const total = o.etapes.length;
    const faites = o.etapes.filter(e=>e.fait).length;
    const el = document.createElement('div');
    el.className = 'dossier-card';
    el.style.borderLeftColor = o.statut==='atteint' ? 'var(--green)' : o.statut==='abandonne' ? 'var(--dim-2)' : 'var(--turq)';
    el.innerHTML = `
      <div class="dossier-top">
        <span class="dossier-client">${escapeHtml(o.titre)}</span>
        <span class="dossier-badge">${o.statut==='atteint'?'Atteint':o.statut==='abandonne'?'Abandonné':'En cours'}</span>
      </div>
      <div class="dossier-meta">
        ${o.dateCible ? `<span>Échéance : ${fmtDate(o.dateCible)}</span>` : ''}
        ${total>0 ? `<span>${faites}/${total} étapes</span>` : ''}
      </div>
    `;
    el.onclick = ()=> openObjPersoPanel(o.id);
    wrap.appendChild(el);
  });
}
function openObjPersoPanel(id){
  const isNew = !id;
  const o = isNew ? { id: uid(), titre:'', description:'', dateCible:'', statut:'en_cours', etapes:[], dateCreation: Date.now() } : state.objectifsPerso.find(x=>x.id===id);
  let etapesLocal = o.etapes.map(e=>({...e}));
  let statutChoisi = o.statut;
  const panel = document.getElementById('panel-content');
  panel.innerHTML = `
    <div class="panel-handle"></div>
    <div class="panel-header">
      <div class="panel-title">${isNew?'Nouvel objectif':'Objectif'}</div>
      <button class="panel-close" id="panel-close">✕</button>
    </div>
    <div class="field-label" style="margin-top:0;">Titre</div>
    <input type="text" id="op-titre" value="${escapeHtml(o.titre)}" placeholder="Ex : Apprendre l'anglais">
    <div class="field-label">Description (optionnel)</div>
    <textarea id="op-description" rows="2" placeholder="Pourquoi cet objectif compte pour toi...">${escapeHtml(o.description)}</textarea>
    <div class="field-label">Échéance (optionnel)</div>
    <input type="date" id="op-date-cible" value="${o.dateCible?dateKeyFromDate(new Date(o.dateCible)):''}">
    <div class="field-label">Statut</div>
    <div class="status-grid" id="op-statut-grid" style="grid-template-columns:1fr 1fr 1fr;"></div>
    <div class="field-label">Étapes</div>
    <div id="op-etapes-list"></div>
    <div style="display:flex;gap:8px;margin-top:8px;">
      <input type="text" id="op-etape-input" placeholder="Ajouter une étape...">
      <button class="inline-add" id="btn-op-etape-add" style="width:44px;">+</button>
    </div>
    <button class="btn" id="btn-op-save">${isNew?'Créer':'Enregistrer'}</button>
    ${!isNew ? `<button class="btn danger" id="btn-op-delete">Supprimer cet objectif</button>` : ''}
  `;
  const statutGrid = panel.querySelector('#op-statut-grid');
  [['en_cours','En cours'],['atteint','Atteint'],['abandonne','Abandonné']].forEach(([v,label])=>{
    const b = document.createElement('button');
    b.className = 'status-opt'+(statutChoisi===v?' active':'');
    b.textContent = label;
    b.style.fontSize='11px';
    b.onclick = ()=>{ statutChoisi=v; statutGrid.querySelectorAll('.status-opt').forEach(x=>x.classList.remove('active')); b.classList.add('active'); };
    statutGrid.appendChild(b);
  });
  function renderEtapes(){
    const etapesWrap = panel.querySelector('#op-etapes-list');
    etapesWrap.innerHTML = etapesLocal.length ? etapesLocal.map(e=>`
      <div class="etape-row">
        <button class="etape-check ${e.fait?'done':''}" data-id="${e.id}">${e.fait?'✓':''}</button>
        <span class="etape-text ${e.fait?'done':''}">${escapeHtml(e.texte)}</span>
        <button class="etape-del" data-id="${e.id}">✕</button>
      </div>
    `).join('') : `<div class="empty-state" style="padding:8px 0;">Aucune étape.</div>`;
    etapesWrap.querySelectorAll('.etape-check').forEach(btn=>{
      btn.onclick = ()=>{ const e = etapesLocal.find(x=>x.id===btn.dataset.id); e.fait=!e.fait; renderEtapes(); };
    });
    etapesWrap.querySelectorAll('.etape-del').forEach(btn=>{
      btn.onclick = ()=>{ etapesLocal = etapesLocal.filter(x=>x.id!==btn.dataset.id); renderEtapes(); };
    });
  }
  renderEtapes();
  panel.querySelector('#btn-op-etape-add').onclick = ()=>{
    const inp = panel.querySelector('#op-etape-input');
    const texte = inp.value.trim();
    if(!texte) return;
    etapesLocal.push({ id: uid(), texte, fait:false });
    inp.value='';
    renderEtapes();
  };
  panel.querySelector('#btn-op-save').onclick = ()=>{
    const titre = panel.querySelector('#op-titre').value.trim();
    if(!titre){ alert('Le titre est requis.'); return; }
    o.titre = titre;
    o.description = panel.querySelector('#op-description').value.trim();
    const dateVal = panel.querySelector('#op-date-cible').value;
    o.dateCible = dateVal ? tsFromDateInput(dateVal) : '';
    o.statut = statutChoisi;
    o.etapes = etapesLocal;
    if(isNew) state.objectifsPerso.push(o);
    save(); closePanel();
    renderObjPersoList(); renderDevPersoStats();
  };
  if(!isNew){
    panel.querySelector('#btn-op-delete').onclick = ()=>{
      if(!confirm(`Supprimer l'objectif "${o.titre}" ?`)) return;
      state.objectifsPerso = state.objectifsPerso.filter(x=>x.id!==id);
      save(); closePanel();
      renderObjPersoList(); renderDevPersoStats();
    };
  }
  panel.querySelector('#panel-close').onclick = closePanel;
  openPanel();
}
document.getElementById('btn-objperso-add').onclick = ()=> openObjPersoPanel(null);

function renderJournalList(){
  const wrap = document.getElementById('journal-list');
  const list = state.journal.slice().sort((a,b)=>b.date-a.date);
  if(list.length===0){
    wrap.innerHTML = `<div class="empty-state">Aucune entrée. Touche "Nouvelle entrée" pour commencer.</div>`;
    return;
  }
  wrap.innerHTML = list.map(j=>`
    <div class="journal-card" data-id="${j.id}">
      <div class="journal-top">
        <span class="journal-date">${fmtDate(j.date)}</span>
        <span class="journal-mood">${j.humeur||''}</span>
      </div>
      <div class="journal-text">${escapeHtml(j.texte)}</div>
    </div>
  `).join('');
  wrap.querySelectorAll('.journal-card').forEach(el=>{
    el.onclick = ()=> openJournalPanel(el.dataset.id);
  });
}
function openJournalPanel(id){
  const isNew = !id;
  const j = isNew ? { id: uid(), date: Date.now(), humeur:'🙂', texte:'' } : state.journal.find(x=>x.id===id);
  const panel = document.getElementById('panel-content');
  panel.innerHTML = `
    <div class="panel-handle"></div>
    <div class="panel-header">
      <div class="panel-title">${isNew?'Nouvelle entrée':'Entrée du journal'}</div>
      <button class="panel-close" id="panel-close">✕</button>
    </div>
    <div class="field-label" style="margin-top:0;">Date</div>
    <input type="date" id="jr-date" value="${dateKeyFromDate(new Date(j.date))}">
    <div class="field-label">Humeur</div>
    <div class="satisfaction-row" id="jr-mood-row"></div>
    <div class="field-label">Texte</div>
    <textarea id="jr-texte" rows="6" placeholder="Une réflexion, une pensée, un moment de gratitude...">${escapeHtml(j.texte)}</textarea>
    <button class="btn" id="btn-jr-save">${isNew?'Enregistrer':'Mettre à jour'}</button>
    ${!isNew ? `<button class="btn danger" id="btn-jr-delete">Supprimer cette entrée</button>` : ''}
  `;
  let moodChoisi = j.humeur;
  const moodRow = panel.querySelector('#jr-mood-row');
  ['😀','🙂','😐','☹️','😢'].forEach(emoji=>{
    const b = document.createElement('button');
    b.className = moodChoisi===emoji?'active':'';
    b.textContent = emoji;
    b.onclick = ()=>{ moodChoisi=emoji; moodRow.querySelectorAll('button').forEach(x=>x.classList.remove('active')); b.classList.add('active'); };
    moodRow.appendChild(b);
  });
  panel.querySelector('#btn-jr-save').onclick = ()=>{
    const texte = panel.querySelector('#jr-texte').value.trim();
    if(!texte){ alert('Écris quelque chose avant d’enregistrer.'); return; }
    j.date = tsFromDateInput(panel.querySelector('#jr-date').value);
    j.humeur = moodChoisi;
    j.texte = texte;
    if(isNew) state.journal.push(j);
    save(); closePanel();
    renderJournalList(); renderDevPersoStats();
  };
  if(!isNew){
    panel.querySelector('#btn-jr-delete').onclick = ()=>{
      if(!confirm('Supprimer cette entrée du journal ?')) return;
      state.journal = state.journal.filter(x=>x.id!==id);
      save(); closePanel();
      renderJournalList(); renderDevPersoStats();
    };
  }
  panel.querySelector('#panel-close').onclick = closePanel;
  openPanel();
}
document.getElementById('btn-journal-add').onclick = ()=> openJournalPanel(null);

function renderDevPersoStats(){
  const wrap = document.getElementById('devperso-stats');
  const meilleurStreak = state.habitudes.reduce((max,h)=>Math.max(max, habitStreak(h)),0);
  const objEnCours = state.objectifsPerso.filter(o=>o.statut==='en_cours').length;
  const items = [
    { n: state.habitudes.length, l:'Habitudes' },
    { n: meilleurStreak>0?'🔥'+meilleurStreak:'0', l:'Meilleure série' },
    { n: objEnCours, l:'Objectifs en cours' },
    { n: state.journal.length, l:'Entrées journal' }
  ];
  wrap.innerHTML = items.map(i=>`<div class="stat-card"><div class="stat-num">${i.n}</div><div class="stat-label">${i.l}</div></div>`).join('');
}

document.getElementById('panel-overlay').addEventListener('click', e=>{ if(e.target.id==='panel-overlay') closePanel(); });

/* ---------- RENDER ALL ---------- */
function renderAll(){
  renderBudgetStats(); renderCatList(); renderTxFilters(); renderTxList();
  renderSportStats(); renderObjSportList();
  renderSanteStats(); renderRdvFilters(); renderRdvList(); renderPoids(); renderSommeil();
  renderDevPersoStats(); renderHabitList(); renderObjPersoList(); renderJournalList();
}
renderAll();

})();
</script>
